  amygdala_deep:
    description: Lateral, basolateral, basomedial, and posterior amygdalar nuclei
    role: soft
    landmark: centroid
    cell_classes: ["014 LA-BLA-BMA-PA Glut"]
    allen_names:
      - "Lateral amygdalar nucleus"
      - "Basolateral amygdalar nucleus"
      - "Basomedial amygdalar nucleus"
      - "Posterior amygdalar nucleus"
    min_cells: 80
