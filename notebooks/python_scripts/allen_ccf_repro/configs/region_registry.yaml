# Frozen region registry for the Allen CCF registration rebuild.
#
# Every entry maps exact `subclass_label_transfer` values from the cell table to
# Allen annotation ids, and assigns a safety role:
#
#   hard      cell class is anatomically restricted to the structure; usable as a
#             fitting landmark and as an acceptance gate.
#   soft      usable as a landmark when the eligibility minimums are met, but the
#             correspondence is looser; never gates acceptance on its own.
#   mask_only used for masks, diagnostics, and metrics; never contributes points.
#   unsafe    never used for landmarks; listed so the exclusion is explicit and
#             reproducible.
#
# `landmark` selects the point-construction strategy in landmarks.py:
#   ladder     quantile ladder along the mediolateral axis with upper/lower edges
#              plus dedicated medial-crest tip anchors (used for DG)
#   ribbon     medians of a thin cell ribbon in mediolateral bins
#   lattice    2D quantile grid plus dorsal/ventral silhouette stations (caudoputamen)
#   centroid   single robust centroid per connected structure
#   components centroid per connected atlas component, matched by proximity
#   bins       medians in mediolateral bins over a filled structure
#   none       no points
version: 4
created: 2026-08-08
notes: >-
  Ids were resolved against annotation_25.nrrd and allen_name_to_annots.pkl and
  then checked for presence in the volume. This annotation is mixed granularity:
  the dentate gyrus is layer-resolved (granule layer 632) while the CA fields and
  the subiculum are not, so CA1/CA2/CA3 use the whole-field ids 382/423/463.
  Every id listed below was verified to occur in annotation_25.nrrd.
  v4: DG ladder covers the medial crest with dedicated tip anchors; caudoputamen
  uses a 2D lattice plus silhouette stations instead of four ML medians.

regions:
  DG_granule:
    description: Dentate gyrus granule cell layer
    role: hard
    landmark: ladder
    cell_classes: ["037 DG Glut"]
    allen_ids: [632]
    min_cells: 80
    min_atlas_pixels: 100
    max_points: 15
    holdout_priority: 0
    gate: true

  CA1:
    description: Field CA1 (not layer-resolved in this annotation volume)
    role: hard
    landmark: ribbon
    cell_classes: ["016 CA1-ProS Glut"]
    allen_ids: [382]
    min_cells: 60
    min_atlas_pixels: 120
    holdout_priority: 2
    gate: true

