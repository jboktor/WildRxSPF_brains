  isocortex:
    description: Isocortex used for thickness diagnostics only
    role: mask_only
    landmark: none
    cell_classes: []
    allen_names: ["Isocortex"]

  corpus_callosum:
    description: Corpus callosum used for flattening diagnostics only
    role: mask_only
    landmark: none
    cell_classes: []
    allen_names: ["corpus callosum"]

  ventricle_system_all:
    description: Full ventricular system used for AP scoring only
    role: mask_only
    landmark: none
    cell_classes: []
    allen_ids: [81, 98, 108, 129, 140, 145, 153, 164]

unsafe_cell_classes:
  - class: "318 Astro-NT NN"
    reason: astrocytes are ubiquitous and carry no regional boundary information
  - class: "319 Astro-TE NN"
    reason: astrocytes are ubiquitous and carry no regional boundary information
  - class: "317 Astro-CB NN"
    reason: astrocytes are ubiquitous and carry no regional boundary information
  - class: "320 Astro-OLF NN"
    reason: astrocytes are ubiquitous and carry no regional boundary information
  - class: "327 Oligo NN"
    reason: white-matter tracts are continuous across structure boundaries
  - class: "326 OPC NN"
    reason: distributed glial population without a structure boundary
  - class: "334 Microglia NN"
    reason: distributed immune population without a structure boundary
  - class: "333 Endo NN"
    reason: vasculature follows no atlas structure boundary
  - class: "331 Peri NN"
    reason: vasculature follows no atlas structure boundary
  - class: "332 SMC NN"
    reason: vasculature follows no atlas structure boundary
  - class: "330 VLMC NN"
    reason: surface-associated, already handled by the outline term
  - class: "335 BAM NN"
    reason: perivascular population without a structure boundary
  - class: "045 OB-STR-CTX Inh IMN"
    reason: migratory immature neurons stream across structure boundaries
  - class: "038 DG-PIR Ex IMN"
    reason: migratory immature neurons stream across structure boundaries
  - class: "064 STR-PAL Chst9 Gaba"
    reason: spans striatum and pallidum, so it cannot anchor either boundary
  - class: "058 PAL-STR Gaba-Chol"
    reason: spans pallidum and striatum, so it cannot anchor either boundary
  - class: "151 TH Prkcd Grin2c Glut"
    reason: covers most of dorsal thalamus, far too broad to localise
  - class: "323 Ependymal NN"
    reason: >-
      aggregate ventricular label with transfer noise scattered through cortex;
      only usable after per-component density filtering, never as a single
      centroid

holdout:
  # Regions rotated out of the fitting set to validate the deformation.
  # The first eligible entry that is not required for the medial fix is used.
  candidates: [CA3, CA1, CA2, caudoputamen, VMH, cortex_L23]
  min_fitting_regions: 3
