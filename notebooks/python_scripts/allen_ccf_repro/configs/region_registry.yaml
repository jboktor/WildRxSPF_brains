  cortex_L23:
    description: Isocortex layer 2/3
    role: soft
    landmark: ribbon
    cell_classes: ["007 L2/3 IT CTX Glut"]
    allen_name_regex: "[Ll]ayer 2/3$"
    allen_name_scope: "Isocortex"
    min_cells: 150
    min_atlas_pixels: 300
    holdout_priority: 6

  cortex_L45:
    description: Isocortex layer 4 and layer 5 intratelencephalic band
    role: soft
    landmark: ribbon
    cell_classes: ["006 L4/5 IT CTX Glut"]
    allen_name_regex: "[Ll]ayer (4|5)$"
