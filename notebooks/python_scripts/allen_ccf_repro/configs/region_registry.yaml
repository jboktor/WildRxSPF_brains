    role: hard
    landmark: centroid
    cell_classes: ["146 LH Pou4f1 Sox1 Glut"]
    allen_ids: [186]
    min_cells: 20
    min_atlas_pixels: 20
    protected: true
    gate: true

  choroid_plexus:
